<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AutoOrdo - Bald verfügbar</title>
<style>
  :root { --bg: #0f1115; --fg: #f2f2f2; --muted: #9aa0a6; --accent: #f5a623; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  .logo { font-size: clamp(2.2rem, 8vw, 3.6rem); font-weight: 800; letter-spacing: .08em; }
  .logo span { color: var(--accent); }
  h1 { margin-top: 18px; font-size: clamp(1.2rem, 4.5vw, 1.6rem); font-weight: 600; }
  p { margin-top: 10px; color: var(--muted); max-width: 32rem; line-height: 1.5; }
</style>
</head>
<body>
  <main>
    <div class="logo">AUTO<span>ORDO</span></div>
    <h1>Bald verfügbar</h1>
    <p>Wir bereiten gerade alles vor. Bis zum Start werden keine Bestellungen angenommen.</p>
  </main>
</body>
</html>
